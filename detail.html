<script>
/* ══════════════════════════════════════════════════════════════════
   U+ Pick 상품 상세 — 영수증형 계산기 + 할인방식 비교
   detail.html?src=samsung&id=card-1
   ══════════════════════════════════════════════════════════════════ */

const ADMIN_PASSWORD = 'jc316719';
const KAKAO_URL = 'https://pf.kakao.com/_xdxaxlxfX/chat';
const TEL = '0505-674-5986';
const APR = 0.059;
const CONTRACT_RATE = 0.25;

let card = null, srcKey = '', allCards = [];
let plans = (window.__plans && window.__plans.length) ? window.__plans
          : [{ name:'데이터플랜MAX', monthly:85000, desc:[] }];
/* 이 상품에 적용되는 요금제. 상품 데이터의 plan 필드가 기준이다.
   (키즈폰 = LTE 키즈22, 휴대폰 = 데이터플랜MAX) */
let avail = plans;
let combo = window.__combo || null;
function planNorm(s){ return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ''); }
function resolvePlans(){
  /* 1순위 — 상품 데이터에 적힌 요금제 */
  const want = planNorm(card && card.plan);
  if (want) {
    const m = plans.filter(p => planNorm(p.name) === want);
    if (m.length) return m;
  }
  /* 2순위 — 페이지별 기본 요금제 (plan 필드가 비어 있는 상품용) */
  const claimed = plans.some(p => Array.isArray(p.src) && p.src.indexOf(srcKey) >= 0);
  const bysrc = plans.filter(p => Array.isArray(p.src) ? p.src.indexOf(srcKey) >= 0 : !claimed);
  if (bysrc.length) return bysrc;
  return plans;
}
let editMode = false, tapCount = 0, tapTimer = null, animTimer = null, lastShown = 0;

const sel = { color:0, storage:0, join:'move', carrier:'T', plan:0, discount:'support', months:24 };

/* ───── 유틸 ───── */
function parseAmt(v){
  if (typeof v === 'number') return v;
  return parseInt(String(v == null ? '' : v).replace(/[^0-9]/g,''), 10) || 0;
}
function num(n){ return (Math.round(n)||0).toLocaleString('ko-KR'); }
function fmt(n){ return num(n) + '원'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function qs(k){ return new URLSearchParams(location.search).get(k); }

function installmentOf(P, m){
  if (!m || P <= 0) return { monthly:0, interest:0 };
  const r = APR / 12;
  const M = Math.round(P * r / (1 - Math.pow(1 + r, -m)));
  return { monthly:M, interest:(M * m) - P };
}

/* 색상 hex → 히어로 배경 틴트
   단순 혼합은 흰색·연한색에서 차이가 사라지므로
   HSL로 바꿔 색조는 유지하고 채도·명도를 정규화한다 */
function hexToRgb(hex){
  let h = String(hex||'').trim().replace('#','');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgbToHsl(r, g, b){
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn;
  const s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  let h;
  if (mx === r)      h = (g - b) / d + (g < b ? 6 : 0);
  else if (mx === g) h = (b - r) / d + 2;
  else               h = (r - g) / d + 4;
  return [h * 60, s, l];
}
function tint(hex){
  const rgb = hexToRgb(hex);
  if (!rgb) return 'hsl(220,6%,95%)';
  const hsl = rgbToHsl(rgb[0], rgb[1], rgb[2]);
  const L = 0.885 + 0.055 * hsl[2];
  if (hsl[1] < 0.08) return 'hsl(220,7%,' + Math.round(L * 100) + '%)';
  const S = Math.min(0.72, Math.max(0.34, hsl[1] * 1.2));
  return 'hsl(' + Math.round(hsl[0]) + ',' + Math.round(S * 100) + '%,' + Math.round(L * 100) + '%)';
}

/* ───── 데이터 로드 ───── */
(function boot(){
  srcKey = (qs('src') || 'samsung').replace(/[^a-zA-Z0-9\-_]/g,'');
  const id = qs('id') || '';
  try {
    const raw = sessionStorage.getItem('uplus_detail');
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.card && (!id || d.card.id === id)) {
        card = d.card; allCards = [d.card]; srcKey = d.src || srcKey;
        return render();
      }
    }
  } catch(e){}

  fetch(srcKey + '.html').then(r => r.text()).then(html => {
    const arr = extractCards(html);
    if (!arr) throw new Error('no-data');
    allCards = arr;
    card = arr.find(c => c.id === id) || arr[0];
    if (!card) throw new Error('no-card');
    render();
  }).catch(() => {
    document.getElementById('app').innerHTML =
      '<div class="state-msg">상품 정보를 불러오지 못했습니다.<br>' +
      '<a href="' + srcKey + '.html" style="color:#E6007E;font-weight:800;">목록으로 돌아가기</a></div>';
  });
})();

function extractCards(html){
  const s = html.indexOf('<script data-cards="1">');
  if (s === -1) return null;
  const open = html.indexOf('>', s) + 1;
  const close = html.indexOf('<' + '/script>', open);
  if (close === -1) return null;
  let js = html.slice(open, close).trim()
            .replace(/^window\.__savedCards\s*=\s*/, '').replace(/;\s*$/, '');
  try { return JSON.parse(js); } catch(e){ return null; }
}

/* ───── 카드 헬퍼 ───── */
function curStorage(){ return (card.storages && card.storages[sel.storage]) || {}; }
function curColor(){ return (card.colors && card.colors[sel.color]) || {}; }
function colorImage(ci, si){
  const c = (card.colors || [])[ci];
  if (!c) return '';
  if (c.images && c.images[si]) return c.images[si];
  if (c.images) { const k = Object.keys(c.images)[0]; if (k != null) return c.images[k]; }
  return c.image || '';
}
function upickOf(st, join){
  const alt = st.oneDiscountChange;
  if (join === 'change' && alt != null && alt !== '') return Math.abs(parseAmt(alt));
  return Math.abs(parseAmt(st.oneDiscount));
}
function isSoldOut(){ return !!card.soldOut || !!curStorage().soldOut; }

/* ───── 계산 ───── */
/* 하나의 할인방식에 대한 전체 비용 */
function scenario(kind){
  const st = curStorage();
  const plan = avail[sel.plan] || plans[0];
  const price   = parseAmt(st.price);
  const subsidy = Math.abs(parseAmt(st.subsidy));
  const upick   = upickOf(st, sel.join);
  const months  = sel.months;
  const cm      = months || 24;                       // 총액 비교 기준 개월
  const cMonthly = Math.round(plan.monthly * CONTRACT_RATE);

  let principal, fee;
  if (kind === 'support') { principal = Math.max(0, price - subsidy - upick); fee = plan.monthly; }
  else                    { principal = Math.max(0, price - upick);           fee = Math.max(0, plan.monthly - cMonthly); }

  const inst = installmentOf(principal, months);
  const total = months ? (inst.monthly + fee) * cm : principal + fee * cm;
  return {
    kind, price, subsidy, upick, plan, months, cm, principal, fee,
    contractMonthly:cMonthly, contractTotal:cMonthly * cm,
    monthlyInst:inst.monthly, interest:inst.interest,
    monthlyTotal:inst.monthly + fee, total
  };
}
function compute(){ return scenario(sel.discount); }

/* 숫자 카운팅 애니메이션 */
function animateTo(target){
  clearInterval(animTimer);
  const el = document.getElementById('heroPrice');
  const mb = document.getElementById('mbarPrice');
  if (!el) return;
  const from = lastShown, diff = target - from, steps = 16;
  let i = 0;
  animTimer = setInterval(() => {
    i++;
    const v = i >= steps ? target : Math.round(from + diff * (1 - Math.pow(1 - i / steps, 3)));
    el.textContent = num(v);
    if (mb) mb.textContent = num(v) + '원';
    if (i >= steps) { clearInterval(animTimer); lastShown = target; }
  }, 22);
}

/* 클립보드 복사 (구형 브라우저·비보안 환경 대비 폴백 포함) */
function copyText(t){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).catch(function(){ legacyCopy(t); });
      return true;
    }
  } catch(e){}
  return legacyCopy(t);
}
function legacyCopy(t){
  try {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch(e){ return false; }
}

/* 카카오톡 상담 — 요약을 복사한 뒤 채팅창을 연다.
   카카오톡 채널 상담방은 외부 앱에서 이미지를 직접 받지 못하므로
   텍스트 붙여넣기가 가장 빠른 경로다. */
function kakaoConsult(){
  const ok = copyText(summaryText());
  // window.open 은 사용자 클릭 안에서 바로 호출해야 팝업 차단에 걸리지 않는다
  openKakao();
  toast(ok ? '선택하신 조건이 복사되었습니다.<br>채팅 입력창을 길게 눌러 <b>붙여넣기</b> 해주세요.'
           : '채팅창에 문의 내용을 입력해 주세요.');
}

/* ───── 조건 이미지 저장 / 공유 ─────
   화면 캡처가 아니라 캔버스에 직접 그린다.
   기기 폭·스크롤 위치와 무관하게 항상 동일한 결과가 나온다. */

/* 아이폰은 사진 앱에 저장하려면 공유 시트를 거쳐야 한다.
   안드로이드·PC 는 바로 내려받는 편이 빠르고 예측 가능하다. */
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function canShareFiles(){
  try {
    return !!(navigator.canShare && navigator.share &&
              navigator.canShare({ files: [new File([new Blob([''])], 'a.png', { type:'image/png' })] }));
  } catch(e){ return false; }
}
function useShare(){ return isIOS() && canShareFiles(); }
function shareLabel(){ return '조건 이미지 저장'; }

function toast(msg){
  const el = document.getElementById('toast');
  if (!el) return;
  el.innerHTML = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 3600);
}

function loadImg(src){
  return new Promise(res => {
    if (!src) return res(null);
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = src;
  });
}

/* 캔버스 헬퍼 */
function _rr(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}
function _t(c, s, x, y, size, weight, color, align){
  c.font = weight + ' ' + size + "px 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif";
  c.fillStyle = color;
  c.textAlign = align || 'left';
  c.textBaseline = 'alphabetic';
  c.fillText(s, x, y);
}
/* 주어진 폭에 맞을 때까지 글자 크기를 줄인다 (최소 크기까지 줄여도 넘치면 말줄임) */
function _fit(c, s, x, y, maxW, size, weight, color, align, min){
  let sz = size;
  const set = v => c.font = weight + ' ' + v + "px 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif";
  set(sz);
  while (c.measureText(s).width > maxW && sz > (min || 20)) { sz -= 1; set(sz); }
  let out = s;
  if (c.measureText(out).width > maxW) {
    while (out.length > 1 && c.measureText(out + '…').width > maxW) out = out.slice(0, -1);
    out += '…';
  }
  _t(c, out, x, y, sz, weight, color, align);
  return sz;
}
function _dash(c, x1, x2, y, color){
  c.save(); c.strokeStyle = color; c.lineWidth = 1.5; c.setLineDash([6, 5]);
  c.beginPath(); c.moveTo(x1, y); c.lineTo(x2, y); c.stroke(); c.restore();
}

async function buildEstimateCanvas(){
  const s = compute();
  const W = 860, P = 44;
  const PINK = '#E6007E', INK = '#111111', SUB = '#5c5c66', MUT = '#8a8a95';

  const phone = await loadImg(colorImage(sel.color, sel.storage));
  const logoEl = document.getElementById('siteLogo');
  const logo = (logoEl && logoEl.getAttribute('src')) ? await loadImg(logoEl.getAttribute('src')) : null;

  /* 높이 계산 */
  const rows = [];
  rows.push(['가입유형', sel.join === 'move'
      ? '번호이동 (' + (sel.carrier === 'MVNO' ? '알뜰폰' : sel.carrier) + ')' : '기기변경']);
  rows.push(['요금제', s.plan.name]);
  rows.push(['할인방식', s.kind === 'support' ? '지원금할인' : '선택약정할인']);
  rows.push(['구매방법', s.months ? s.months + '개월 할부' : '일시불']);

  /* 넉넉한 캔버스에 그린 뒤, 마지막에 실제 높이로 잘라낸다.
     항목 수가 달라져도 아래 여백이 남지 않는다. */
  const HEAD = 230, FOOT = 128, HMAX = 2000;

  const cv = document.createElement('canvas');
  cv.width = W * 2; cv.height = HMAX * 2;
  const c = cv.getContext('2d');
  c.scale(2, 2);
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, HMAX);

  /* ── 헤더 ── */
  c.fillStyle = tint(curColor().hex);
  c.fillRect(0, 0, W, HEAD);

  c.fillStyle = '#ffffff';
  _rr(c, P, 36, 158, 158, 20); c.fill();
  if (phone) {
    const box = 130, ox = P + 14, oy = 50;
    const r = Math.min(box / phone.width, box / phone.height);
    const w = phone.width * r, h = phone.height * r;
    c.drawImage(phone, ox + (box - w) / 2, oy + (box - h) / 2, w, h);
  } else {
    _t(c, '이미지 준비중', P + 79, 122, 14, '600', '#c4c4cc', 'center');
  }

  const tx = P + 158 + 28;
  const availW = W - P - tx;
  _fit(c, card.name || '상품', tx, 96, availW, 38, '800', INK, 'left', 22);
  _fit(c, [curColor().name, curStorage().label].filter(Boolean).join('  ·  '),
       tx, 130, availW, 19, '700', 'rgba(0,0,0,.62)', 'left', 13);
  _t(c, '월 예상 금액', tx, 168, 15, '800', 'rgba(0,0,0,.6)');
  _fit(c, fmt(s.monthlyTotal), W - P, 174, availW - 110, 40, '800', INK, 'right', 24);

  /* ── 선택 조건 ── */
  let y = HEAD + 44;
  _t(c, '선택 조건', P, y, 14, '800', MUT);
  y += 20;
  rows.forEach(r => {
    _t(c, r[0], P, y + 22, 17, '600', SUB);
    _fit(c, r[1], W - P, y + 22, W - P * 2 - 160, 17, '800', INK, 'right', 12);
    c.fillStyle = '#f1f1f4'; c.fillRect(P, y + 36, W - P * 2, 1);
    y += 46;
  });

  /* ── A. 월 할부금 ── */
  y += 26;
  c.fillStyle = PINK; _rr(c, P, y - 17, 24, 24, 7); c.fill();
  _t(c, 'A', P + 12, y, 14, '800', '#ffffff', 'center');
  _t(c, s.months ? '월 할부금 (' + s.months + '개월)' : '단말 결제금액 (일시불)', P + 36, y, 20, '800', INK);
  _t(c, fmt(s.months ? s.monthlyInst : s.principal), W - P, y + 2, 24, '800', INK, 'right');
  y += 34;

  const IND = P + 36;
  const line = (k, v, col) => {
    _fit(c, k, IND, y, W - P - IND - 190, 16, '600', col || SUB, 'left', 12);
    _t(c, v, W - P, y, 16, '800', col || INK, 'right');
    y += 40;
  };
  line('출고가', fmt(s.price));
  if (s.kind === 'support') line('이통사 지원금', '-' + fmt(s.subsidy), PINK);
  else                      line('이통사 지원금', '미적용', '#a5a5af');
  line('U+ pick 할인', '-' + fmt(s.upick), PINK);
  c.fillStyle = '#eeeef2'; c.fillRect(IND, y - 26, W - P - IND, 1);
  line('할부원금', fmt(s.principal));
  _t(c, s.months ? '연 5.9% 할부이자 ' + fmt(s.interest) + ' 포함' : '할부이자 없음', IND, y - 14, 14, '600', MUT);

  /* ── B. 월 통신요금 ── */
  y += 34;
  c.fillStyle = '#ececf0'; c.fillRect(P, y - 26, W - P * 2, 1);
  c.fillStyle = PINK; _rr(c, P, y - 17, 24, 24, 7); c.fill();
  _t(c, 'B', P + 12, y, 14, '800', '#ffffff', 'center');
  _t(c, '월 통신요금', P + 36, y, 20, '800', INK);
  _t(c, fmt(s.fee), W - P, y + 2, 24, '800', INK, 'right');
  y += 34;
  line(s.plan.name, fmt(s.plan.monthly));
  if (s.kind === 'contract') line('선택약정 25% 할인', '-' + fmt(s.contractMonthly), PINK);
  _t(c, '부가세(VAT) 포함 금액', IND, y - 14, 14, '600', MUT);

  /* ── 합계 ── */
  y += 30;
  _dash(c, P, W - P, y, '#d8d8e0');
  y += 46;
  _t(c, '월 예상 금액', P, y, 21, '800', INK);
  _t(c, 'A+B', P + 128, y - 2, 13, '800', PINK);
  _t(c, fmt(s.monthlyTotal), W - P, y + 4, 36, '800', PINK, 'right');

  /* ── 푸터 ── */
  y += 40;
  c.fillStyle = '#fafafb'; c.fillRect(0, y, W, FOOT);
  c.fillStyle = '#ececf0'; c.fillRect(0, y, W, 1);
  const fy = y + 52;
  if (logo) {
    const lh = 34, lw = logo.width * (lh / logo.height);
    c.drawImage(logo, P, fy - 24, lw, lh);
    _t(c, '상담문의 ' + TEL, P + lw + 20, fy, 17, '800', INK);
  } else {
    _t(c, 'U+ Pick  ·  상담문의 ' + TEL, P, fy, 17, '800', INK);
  }
  _t(c, '※ 결합 · 복지 · 제휴카드 할인은 미반영 금액입니다. 실제 조건은 상담 시 안내해 드립니다.',
     P, fy + 32, 13.5, '600', MUT);
  const d = new Date();
  const pad = n => (n < 10 ? '0' : '') + n;
  _t(c, d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' 기준',
     W - P, fy + 32, 13.5, '600', MUT, 'right');

  /* 실제 높이로 잘라내기 */
  const finalH = Math.min(HMAX, Math.round(y + FOOT));
  const out = document.createElement('canvas');
  out.width = W * 2; out.height = finalH * 2;
  out.getContext('2d').drawImage(cv, 0, 0, W * 2, finalH * 2, 0, 0, W * 2, finalH * 2);
  return out;
}

function saveEstimate(btn){
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '만드는 중…'; }
  const restore = () => { if (btn) { btn.disabled = false; btn.textContent = label; } };

  buildEstimateCanvas().then(cv => {
    const name = ((card.name || '견적') + '_' + (curStorage().label || '') + '_UPick')
                 .replace(/[^0-9A-Za-z가-힣_]/g, '') + '.png';
    cv.toBlob(blob => {
      if (!blob) { restore(); toast('이미지를 만들지 못했습니다.'); return; }
      const file = new File([blob], name, { type: 'image/png' });

      const done = '이미지가 저장되었습니다.<br>카카오톡 채팅창의 <b>+</b> → <b>앨범</b>에서 첨부해 주세요.';

      if (useShare()) {
        navigator.share({ files: [file], title: (card.name || '') + ' 견적' })
          .then(() => restore())
          .catch(err => {
            restore();
            if (err && err.name === 'AbortError') return;
            downloadBlob(blob, name);
            toast(done);
          });
        return;
      }
      downloadBlob(blob, name);
      restore();
      toast(done);
    }, 'image/png');
  }).catch(() => { restore(); toast('이미지를 만들지 못했습니다.'); });
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ───── 관리자 ─────
   PC : 키보드로 adminjc 입력
   모바일 : 로고 5번 연속 탭
   (index.html 과 동일한 방식) */
const SECRET_KEY = 'adminjc';
let keyBuffer = '';

document.addEventListener('keydown', function(e){
  if (!e.key || e.key.length !== 1) return;
  // 입력창·편집중인 요소에 타이핑할 때는 무시
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  keyBuffer += e.key.toLowerCase();
  if (keyBuffer.length > SECRET_KEY.length) keyBuffer = keyBuffer.slice(-SECRET_KEY.length);
  if (keyBuffer === SECRET_KEY) { keyBuffer = ''; openPwModal(); }
});

function logoTap(){
  tapCount++; clearTimeout(tapTimer);
  tapTimer = setTimeout(() => tapCount = 0, 1500);
  if (tapCount >= 5) { tapCount = 0; openPwModal(); }
}
function openPwModal(){
  document.getElementById('pwInput').value = '';
  document.getElementById('pwError').textContent = '';
  document.getElementById('pwInput').classList.remove('error');
  document.getElementById('pwOverlay').classList.add('visible');
  setTimeout(() => document.getElementById('pwInput').focus(), 50);
}
function closePwModal(){ document.getElementById('pwOverlay').classList.remove('visible'); }
function checkPassword(){
  if (document.getElementById('pwInput').value === ADMIN_PASSWORD) {
    closePwModal();
    document.getElementById('editToolbar').classList.add('visible');
    toggleEdit(true);
  } else {
    document.getElementById('pwInput').classList.add('error');

  }
}
function onEditBtnClick(){ toggleEdit(!editMode); }
function toggleEdit(on){
  editMode = on;
  document.body.classList.toggle('edit-mode', on);

  document.getElementById('toolbarLabel').textContent = on ? '✏️ 편집중 — 금액을 눌러 수정' : '✏️ 관리자 편집 모드';
}
function applyEditable(on){
  document.querySelectorAll('.editable').forEach(el => el.contentEditable = on ? 'true' : 'false');
}
function saveAmt(field, val){

}
function saveUpick(val){

function savePlanMonthly(val){

function saveSourceHTML(){
  const btn = document.getElementById('saveBtn');
  const file = srcKey + '.html';
  const restore = () => { btn.textContent = '💾 상품정보 저장'; btn.disabled = false; };

  const patch = (html) => {
    try {
      const s = html.indexOf('<script data-cards="1">');
      if (s === -1) throw new Error('선택한 파일에 상품 데이터가 없습니다. ' + file + ' 이 맞는지 확인해 주세요.');
      const open = html.indexOf('>', s) + 1;
      const close = html.indexOf('<' + '/script>', open);
      const merged = extractCards(html) || [];
      const i = merged.findIndex(c => c.id === card.id);
      if (i >= 0) merged[i] = card; else merged.push(card);
      download(html.slice(0, open) + 'window.__savedCards = ' + JSON.stringify(merged) + ';' + html.slice(close), file);
      alert('저장되었습니다.\n다운로드된 ' + file + ' 을 기존 파일과 교체해 주세요.');
    } catch (e) { alert('저장 실패: ' + e.message); }
    restore();
  };

  // 파일을 직접 열어본 경우(file://)는 브라우저가 다른 파일을 읽지 못한다.
  // 이때는 사용자가 원본 파일을 직접 고르게 한다.
  if (location.protocol === 'file:') {
    toast(file + ' 파일을 선택해 주세요.<br>선택한 파일에 수정 내용을 반영해 내려받습니다.');
    pickFile(patch, restore);
    return;
  }

  btn.textContent = '불러오는 중…'; btn.disabled = true;
  fetch(file)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(patch)
    .catch(() => {
      restore();
      alert('원본 파일을 자동으로 읽지 못했습니다.\n\n' +
            '저장 버튼을 다시 누른 뒤 ' + file + ' 파일을 직접 선택해 주세요.');
      pickFile(patch, restore);
    });
}

/* 원본 HTML 파일 직접 선택 (file:// 환경 대응) */
function pickFile(onLoad, onCancel){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.html,.htm,text/html';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = function(){
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) { if (onCancel) onCancel(); return; }
    const fr = new FileReader();
    fr.onload = () => onLoad(String(fr.result));
    fr.onerror = () => { alert('파일을 읽지 못했습니다.'); if (onCancel) onCancel(); };
    fr.readAsText(f, 'utf-8');
  };
  inp.click();
}
/* 요금제·배너 저장 — 현재 문서를 그대로 복제해 쓴다.
   파일을 직접 열어도(file://) 동작한다. */
function savePlansHTML(){
  try {
    const clone = document.documentElement.cloneNode(true);

    // 화면에 그려진 내용은 되돌린다 (단말 사진이 파일에 박히는 것을 막는다)
    const app = clone.querySelector('#app');
    if (app) app.innerHTML = '<div class="state-msg">상품 정보를 불러오는 중입니다…</div>';

    // 편집 상태 초기화
    const body = clone.querySelector('body');
    if (body) body.classList.remove('edit-mode');
    clone.querySelectorAll('[contenteditable]').forEach(el => el.setAttribute('contenteditable', 'false'));
    const tb = clone.querySelector('#editToolbar'); if (tb) tb.className = 'edit-toolbar';
    const eb = clone.querySelector('#editBtn'); if (eb) { eb.textContent = '편집 시작'; eb.style.background = ''; }
    const sb = clone.querySelector('#saveBtn'); if (sb) sb.style.display = 'none';
    const pb = clone.querySelector('#savePlanBtn'); if (pb) pb.style.display = 'none';
    const lb = clone.querySelector('#toolbarLabel'); if (lb) lb.textContent = '✏️ 관리자 편집 모드';
    const pw = clone.querySelector('#pwOverlay'); if (pw) pw.className = 'pw-overlay';

    // 요금제·배너 데이터 갱신
    const ds = clone.querySelector('script[data-plans="1"]');
    if (!ds) throw new Error('요금제 블록을 찾지 못했습니다');
    ds.textContent = '\nwindow.__plans = ' + JSON.stringify(plans, null, 2) + ';\n' +
                     (combo ? 'window.__combo = ' + JSON.stringify(combo, null, 2) + ';\n' : '');

    download('<!DOCTYPE html>\n' + clone.outerHTML, 'detail.html');
    alert('요금제·결합배너가 저장되었습니다.\n다운로드된 detail.html 을 교체해 주세요.');
  } catch (e) {
    alert('저장 실패: ' + e.message);
  }
}
function download(text, filename){
  const blob = new Blob([text], { type:'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename; a.click();
  URL.revokeObjectURL(a.href);
}
