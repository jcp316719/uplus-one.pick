  .combo {

    content:''; position:absolute; top:0; left:0; width:38%; height:100%;
    background:linear-gradient(100deg, rgba(255,255,255,0) 0%,

    animation:comboShine 4s cubic-bezier(.35,0,.2,1) infinite;
    pointer-events:none; z-index:0;
  }
  @keyframes comboShine {
    0%, 18%  { transform:translateX(-180%) skewX(-18deg); }

  .bk-box {

  /* 절취선 — 양옆을 반원으로 파서 진짜 영수증처럼 보이게 한다.
     창 모서리를 둥글게 유지하려고 overflow:hidden 을 쓰므로,

  .bk-tear {

  .bk-kakao {

  /* ── 개통 후기 (견적과 상담 버튼 사이) ── */
  .rv-wrap { margin-top:20px; padding-top:18px; border-top:1px solid #ececed; }

  /* 가로로 넘겨 본다. 후기가 늘어나도 페이지가 길어지지 않는다.
     카드 한 장이 거의 폭을 다 쓰고 다음 장이 살짝만 보이게 해서,

  .rv-track {

  /* 체크박스까지 가로 100% 가 되면 옆의 글자가 밀려 세로로 쪼개진다. 체크박스는 제외한다. */

<script>
/* ══════════════════════════════════════════════════════════════════
   U+ Pick 상품 상세 — 영수증형 계산기 + 할인방식 비교
   detail.html?src=samsung&id=card-1
   ══════════════════════════════════════════════════════════════════ */

const ADMIN_PASSWORD = 'jc316719';
const BASE_TITLE = '휴대폰 견적 계산 - U+ Pick';   // 저장 시 되돌릴 기본 제목
const KAKAO_URL = 'https://pf.kakao.com/_xdxaxlxfX/chat';
const TEL = '0505-674-5986';
const APR = 0.059;
const CONTRACT_RATE = 0.25;

/* ── 상담 가능 시간 (연중무휴 10:00 ~ 20:00) ──
   이 시간이 지나면 카톡·전화 대신 '상담 예약' 폼이 뜬다.
   시간은 방문자 기기 설정이 아니라 한국 시각으로 직접 계산한다. */
const BIZ_OPEN = 10;
const BIZ_CLOSE = 20;
/* 사전예약 신청과 같은 곳으로 보낸다 (구글 시트 + 메일 + 관리자 알림톡) */
const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz81emfBNw6QzCFaSp_GMNhsOc2U2mvfvxiTZeO6yZd1_TSgSD9myA2k1g6pf4ktIUHPw/exec';

function seoulHour() {
  try {
    return Number(new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Seoul', hour: 'numeric', hour12: false
    }).format(new Date()));
  } catch (e) {
    return new Date().getHours();   // 아주 오래된 브라우저 대비
  }
}
function isBizOpen() {
  const h = seoulHour();
  return h >= BIZ_OPEN && h < BIZ_CLOSE;
}

let card = null, srcKey = '', allCards = [];
let plans = (window.__plans && window.__plans.length) ? window.__plans
          : [{ name:'데이터플랜MAX', monthly:85000, desc:[] }];
/* 이 상품에 적용되는 요금제. 상품 데이터의 plan 필드가 기준이다.
   (키즈폰 = LTE 키즈22, 휴대폰 = 데이터플랜MAX) */
let avail = plans;
let combo = window.__combo || null;
function planNorm(s){ return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ''); }
function resolvePlans(){
  /* 0순위 — 요금제를 여러 개 쓰는 상품 (planList)
     요금제에 따라 이통사 지원금이 달라지는 기종에 쓴다. */
  const list = card && card.planList;
  if (Array.isArray(list) && list.length) {
    const keys = list.map(planNorm);
    const m = plans.filter(p => keys.indexOf(planNorm(p.name)) >= 0);
    /* 적어둔 순서를 그대로 따른다 */
    m.sort((a, b) => keys.indexOf(planNorm(a.name)) - keys.indexOf(planNorm(b.name)));
    if (m.length) return m;
  }
  /* 1순위 — 상품 데이터에 적힌 요금제 */
  const want = planNorm(card && card.plan);
  if (want) {
    const m = plans.filter(p => planNorm(p.name) === want);
    if (m.length) return m;
  }
  /* 2순위 — 페이지별 기본 요금제 (plan 필드가 비어 있는 상품용) */
  const claimed = plans.some(p => Array.isArray(p.src) && p.src.indexOf(srcKey) >= 0);
  const bysrc = plans.filter(p => Array.isArray(p.src) ? p.src.indexOf(srcKey) >= 0 : !claimed);
  if (bysrc.length) return bysrc;
  return plans;
}
let editMode = false, tapCount = 0, tapTimer = null, animTimer = null, lastShown = 0;

const sel = { color:0, storage:0, join:'move', carrier:'T', plan:0, discount:'support', months:24 };

/* ───── 유틸 ───── */
function parseAmt(v){
  if (typeof v === 'number') return v;
  return parseInt(String(v == null ? '' : v).replace(/[^0-9]/g,''), 10) || 0;
}
function num(n){ return (Math.round(n)||0).toLocaleString('ko-KR'); }
function fmt(n){ return num(n) + '원'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function qs(k){ return new URLSearchParams(location.search).get(k); }

function installmentOf(P, m){
  if (!m || P <= 0) return { monthly:0, interest:0 };
  const r = APR / 12;
  const M = Math.round(P * r / (1 - Math.pow(1 + r, -m)));
  return { monthly:M, interest:(M * m) - P };
}

/* 색상 hex → 히어로 배경 틴트
   단순 혼합은 흰색·연한색에서 차이가 사라지므로
   HSL로 바꿔 색조는 유지하고 채도·명도를 정규화한다 */
function hexToRgb(hex){
  let h = String(hex||'').trim().replace('#','');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgbToHsl(r, g, b){
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn;
  const s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  let h;
  if (mx === r)      h = (g - b) / d + (g < b ? 6 : 0);
  else if (mx === g) h = (b - r) / d + 2;
  else               h = (r - g) / d + 4;
  return [h * 60, s, l];
}
function tint(hex){
  const rgb = hexToRgb(hex);
  if (!rgb) return 'hsl(220,6%,95%)';
  const hsl = rgbToHsl(rgb[0], rgb[1], rgb[2]);
  /* 원래 밝기를 넓게 반영한다. 검정 계열은 80% 안팎, 흰 계열은 94% 안팎.
     (이전에는 89~94% 로 뭉쳐서 검정과 흰색이 구분되지 않았다) */
  const L = 0.80 + 0.145 * hsl[2];
  if (hsl[1] < 0.08) return 'hsl(220,7%,' + Math.round(L * 100) + '%)';
  /* 채도는 최소값을 강제하지 않는다. 딥블루·바이올렛처럼 차분한 색이
     실제보다 쨍하게 보이던 문제를 없앤다. */
  const S = Math.min(0.72, Math.max(0.10, hsl[1] * 1.15));
  return 'hsl(' + Math.round(hsl[0]) + ',' + Math.round(S * 100) + '%,' + Math.round(L * 100) + '%)';
}

/* ───── 데이터 로드 ───── */
(function boot(){
  srcKey = (qs('src') || 'samsung').replace(/[^a-zA-Z0-9\-_]/g,'');
  const id = qs('id') || '';
  try {
    const raw = sessionStorage.getItem('uplus_detail');
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.card && (!id || d.card.id === id)) {
        card = d.card; allCards = [d.card]; srcKey = d.src || srcKey;
        return render();
      }
    }
  } catch(e){
    /* 화면 그리는 중 오류가 나면 조용히 넘기지 않고 남긴다.
       예전에 이 자리에서 오류가 묻히는 바람에 원인을 찾기 어려웠다. */
    console.error('[detail] 렌더 실패:', e);
  }

  fetch(srcKey + '.html').then(r => r.text()).then(html => {
    const arr = extractCards(html);
    if (!arr) throw new Error('no-data');
    allCards = arr;
    card = arr.find(c => c.id === id) || arr[0];
    if (!card) throw new Error('no-card');
    render();
  }).catch(() => {
    document.getElementById('app').innerHTML =
      '<div class="state-msg">상품 정보를 불러오지 못했습니다.<br>' +
      '<a href="' + srcKey + '.html" style="color:#E6007E;font-weight:800;">목록으로 돌아가기</a></div>';
  });
})();

function extractCards(html){
  const s = html.indexOf('<script data-cards="1">');
  if (s === -1) return null;
  const open = html.indexOf('>', s) + 1;
  const close = html.indexOf('<' + '/script>', open);
  if (close === -1) return null;
  let js = html.slice(open, close).trim()
            .replace(/^window\.__savedCards\s*=\s*/, '').replace(/;\s*$/, '');
  try { return JSON.parse(js); } catch(e){ return null; }
}

/* ───── 카드 헬퍼 ───── */
function curStorage(){ return (card.storages && card.storages[sel.storage]) || {}; }
function curColor(){ return (card.colors && card.colors[sel.color]) || {}; }
/* 목록 페이지(getColorImage)와 우선순위를 반드시 같게 유지할 것.
   관리자 모드에서 사진을 바꾸면 image 가 갱신되고 images 에는 이전 사진이 남는다.
   images 를 먼저 보면 목록에는 새 사진, 상세에는 옛 사진이 뜬다. */
function colorImage(ci, si){
  const c = (card.colors || [])[ci];
  if (!c) return '';
  if (c.image) return c.image;
  if (c.images && c.images[si]) return c.images[si];
  if (c.images) {
    const keys = Object.keys(c.images);
    for (let i = 0; i < keys.length; i++) { if (c.images[keys[i]]) return c.images[keys[i]]; }
  }
  return '';
}
/* 이통사 지원금은 요금제에 따라 달라질 수 있다.
   subsidyByPlan 에 요금제 이름별 금액이 있으면 그걸 쓰고, 없으면 기존 subsidy 를 쓴다.
   (요금제가 하나뿐인 기존 상품들은 아무 영향이 없다) */
function subsidyOf(st, plan){
  const m = st && st.subsidyByPlan;
  if (m && plan) {
    const want = planNorm(plan.name);
    for (const k in m) if (planNorm(k) === want) return Math.abs(parseAmt(m[k]));
  }
  return Math.abs(parseAmt(st.subsidy));
}

/* 관리자가 지원금을 고치면 지금 고른 요금제 칸에 기록한다 */
function setSubsidyOf(st, plan, val){
  const m = st && st.subsidyByPlan;
  if (m && plan) {
    const want = planNorm(plan.name);
    for (const k in m) if (planNorm(k) === want) { m[k] = val; return; }
  }
  st.subsidy = val;
}

function upickOf(st, join){
  const alt = st.oneDiscountChange;
  if (join === 'change' && alt != null && alt !== '') return Math.abs(parseAmt(alt));
  return Math.abs(parseAmt(st.oneDiscount));
}
function isSoldOut(){ return !!card.soldOut || !!curStorage().soldOut; }

/* ───── 계산 ───── */
/* 하나의 할인방식에 대한 전체 비용 */
function scenario(kind){
  const st = curStorage();
  const plan = avail[sel.plan] || plans[0];
  const price   = parseAmt(st.price);
  const subsidy = subsidyOf(st, plan);
  const upick   = upickOf(st, sel.join);
  const months  = sel.months;
  const cm      = months || 24;                       // 총액 비교 기준 개월
  const cMonthly = Math.round(plan.monthly * CONTRACT_RATE);

  let principal, fee;
  if (kind === 'support') { principal = Math.max(0, price - subsidy - upick); fee = plan.monthly; }
  else                    { principal = Math.max(0, price - upick);           fee = Math.max(0, plan.monthly - cMonthly); }

  const inst = installmentOf(principal, months);
  const total = months ? (inst.monthly + fee) * cm : principal + fee * cm;
  return {
    kind, price, subsidy, upick, plan, months, cm, principal, fee,
    contractMonthly:cMonthly, contractTotal:cMonthly * cm,
    monthlyInst:inst.monthly, interest:inst.interest,
    monthlyTotal:inst.monthly + fee, total
  };
}
function compute(){ return scenario(sel.discount); }

/* ───── 렌더 ───── */
function render(){
  avail = resolvePlans();
  if (sel.plan >= avail.length) sel.plan = 0;
  /* 카드에 적힌 요금제를 기본으로 고른다.
     상품 목록에서 본 금액과 상세페이지 첫 화면 금액이 어긋나지 않도록. */
  if (card && card.plan) {
    const i = avail.findIndex(p => planNorm(p.name) === planNorm(card.plan));
    if (i >= 0) sel.plan = i;
  }
  document.title = (card.name || '상품') + ' - U+ Pick';
  const ogt = document.querySelector('meta[property="og:title"]');
  if (ogt) ogt.setAttribute('content', document.title);
  const navEl = document.querySelector('.header-nav a[data-nav="' + srcKey + '"]');
  if (navEl) navEl.classList.add('on');

  document.getElementById('app').innerHTML =
    '<div class="hero" id="hero"><div class="hero-in">' +
      '<button class="hero-back" onclick="goBack()" aria-label="뒤로">←</button>' +
      '<div class="hero-img" id="heroImg"></div>' +
      '<div class="hero-txt">' +
        '<div class="hero-badges" id="heroBadges"></div>' +
        '<div class="hero-name">' + esc(card.name || '이름 미입력') + '</div>' +
        '<div class="hero-sub" id="heroSub"></div>' +
      '</div>' +
      '<div class="hero-right">' +
        '<div class="hero-price-lb">월 예상 금액</div>' +
        '<div class="hero-price num"><span id="heroPrice">0</span><span class="won">원</span></div>' +
      '</div>' +
    '</div></div>' +
    '<div class="wrap"><div class="cols">' +
      '<div class="col-opt" id="colOpt"></div>' +
      '<div class="col-rcp" id="colRcp"></div>' +
    '</div></div>' +
    '<div class="mbar">' +
      '<div style="flex:1;min-width:0"><div class="k">월 예상 금액</div><div class="v num" id="mbarPrice">-</div></div>' +
      /* 상단 헤더와 아래 버튼 줄에 이미 카톡이 있어 세 번 겹친다.
         스크롤 중에도 늘 보이는 자리이므로, 주된 행동인 '예약'을 둔다. */
      '<button class="b b-book" id="mbarBtn" onclick="openBookModal()">📅 상담 예약</button>' +
    '</div>' +
    '<div class="toast" id="toast"></div>';

  const bmap = { new:['badge-new','최신'], hot:['badge-hot','인기'], event:['badge-event','이벤트'],
                 support:['badge-support','지원금'], soon:['badge-soon','출시예정'] };
  document.getElementById('heroBadges').innerHTML =
    (card.badges || []).map(b => bmap[b] ? '<span class="badge ' + bmap[b][0] + '">' + bmap[b][1] + '</span>' : '').join('');

  paintHero(); paintOptions(); paintReceipt();
}

function paintHero(){
  const img = colorImage(sel.color, sel.storage);
  document.getElementById('heroImg').innerHTML =
    img ? '<img src="' + img + '" alt="' + esc(card.name) + '">' : '<span class="ph">이미지 준비중</span>';
  document.getElementById('hero').style.background = tint(curColor().hex);
  document.getElementById('heroSub').textContent =

/* 숫자 카운팅 애니메이션 */
function animateTo(target){
  clearInterval(animTimer);
  const el = document.getElementById('heroPrice');
  const mb = document.getElementById('mbarPrice');
  if (!el) return;
  const from = lastShown, diff = target - from, steps = 16;
  let i = 0;
  animTimer = setInterval(() => {
    i++;
    const v = i >= steps ? target : Math.round(from + diff * (1 - Math.pow(1 - i / steps, 3)));
    el.textContent = num(v);
    if (mb) mb.textContent = num(v) + '원';
    if (i >= steps) { clearInterval(animTimer); lastShown = target; }
  }, 22);
}

/* ── 요금제에 딸린 OTT 혜택 ──
   요금제 데이터의 ott 배열에 이름을 적으면 동그라미로 나온다.
   images 폴더에 ott-넷플릭스.png 처럼 파일을 두면 글자 대신 그 로고가 쓰인다. */
function ottHTML(plan){
  const list = plan && plan.ott;
  if (!Array.isArray(list) || !list.length) return '';

  /* 목록은 함수 안에 둔다. 바깥에 두면 페이지를 그리는 코드가 먼저 실행돼
     아직 값이 채워지지 않은 상태로 읽게 되고, 상세페이지가 통째로 안 열린다. */
  const OTT_STYLE = {
    '넷플릭스':      { bg:'#141414', file:'ott-netflix' },
    '유튜브 프리미엄': { bg:'#ff0033', file:'ott-youtube' },
    '유튜브':        { bg:'#ff0033', file:'ott-youtube' },
    '디즈니+':       { bg:'#0063e5', file:'ott-disney' },
    '티빙':          { bg:'#ff153c', file:'ott-tving' }
  };

  const items = list.map(n => {
    const st = OTT_STYLE[n] || { bg:'#666', file:'' };
    const inner = st.file
      /* 로고 파일이 없으면 글자로 되돌리고, 그때는 브랜드 색 배경을 다시 깐다 */
      ? '<img src="images/' + st.file + '.png" alt="' + esc(n) + '"' +
        ' onerror="this.parentNode.style.background=\'' + st.bg + '\';' +
        'this.replaceWith(document.createTextNode(\'' + esc(n) + '\'))">'
      : esc(n);
    /* 로고 파일을 쓰는 경우 로고에 이미 테두리가 있으므로 배경색을 넣지 않는다.
       글자로 나올 때만 브랜드 색을 깐다. */
    const bgStyle = st.file ? '' : ' style="background:' + st.bg + '"';
    return '<span class="ott-item"><span class="ott-dot"' + bgStyle + '>' +
           inner + '</span><em>' + esc(n) + '</em></span>';
  }).join('');
  return '<div class="ott-row">' + items +
         '<span class="ott-note">' + esc(plan.ottNote || '중 택 1') + '</span></div>';
}

/* ── 개통 후기 ──
   목록은 window.__reviews 한 곳에만 있고 모든 기기가 공유한다.
   지금 보고 있는 기기와 같은 사례, 그다음 같은 가입유형 사례를 앞으로 보낸다.
   후기를 더 쓰지 않아도 보는 사람마다 순서가 달라진다. */
function reviewList() {
  var r = window.__reviews;
  if (!r || r.off || !Array.isArray(r.list)) return [];
  return r.list.filter(function (x) { return x && !x.off && String(x.text || '').trim(); });
}

function reviewsHTML() {
  var list = reviewList();
  if (!list.length) return '';

  var curDev = (card && card.name ? String(card.name) : '').replace(/\s+/g, '').toLowerCase();
  var curJoin = sel.join === 'change' ? 'change' : 'move';

  /* 점수가 높은 것부터. 같은 점수면 원래 순서를 지킨다. */
  var scored = list.map(function (x, i) {
    var dev = String(x.device || '').replace(/\s+/g, '').toLowerCase();
    var s = 0;
    if (dev && curDev && (dev === curDev || dev.indexOf(curDev) > -1 || curDev.indexOf(dev) > -1)) s += 2;
    if (x.join && x.join === curJoin) s += 1;
    return { x: x, s: s, i: i };
  }).sort(function (a, b) { return b.s - a.s || a.i - b.i; });

  /* 상세페이지 선택지에는 없지만 후기에는 신규가입 사례도 들어간다. */
  var JOIN_LABEL = { move: '번호이동', change: '기기변경', 'new': '신규가입' };
  var cards = scored.map(function (o) {
    var x = o.x;
    var badge = x.join && JOIN_LABEL[x.join]
      ? '<span class="rv-join rv-' + x.join + '">' + esc(JOIN_LABEL[x.join]) + '</span>' : '';
    var dev = x.device ? '<span class="rv-dev">' + esc(x.device) + '</span>' : '';
    return '<div class="rv-card">' +
             '<div class="rv-top">' + badge + dev + '</div>' +
             '<p class="rv-text">' + esc(x.text) + '</p>' +
             '<div class="rv-foot"><span>' + esc(maskName(x.name)) + '</span><span>' + esc(x.date || '') + '</span></div>' +
           '</div>';
  }).join('');

  /* 후기가 2개 이상일 때만 넘김 버튼을 단다.
     PC 는 스크롤바를 숨겨놔서 버튼이 없으면 넘길 방법이 아예 없다. */
  var nav = scored.length > 1
    ? '<div class="rv-nav">' +
        '<button type="button" class="rv-arrow" onclick="rvScroll(-1)" aria-label="이전 후기">‹</button>' +
        '<button type="button" class="rv-arrow" onclick="rvScroll(1)" aria-label="다음 후기">›</button>' +
      '</div>'
    : '';

  return '<div class="rv-wrap">' +
           '<div class="rv-head"><span class="rv-title">개통 후기</span>' +
             '<span class="rv-sub">실제 상담 사례</span>' + nav + '</div>' +
           '<div class="rv-track" id="rvTrack">' + cards + '</div>' +
         '</div>';
}

    ['용량 · 색상', [st.label, col ? col.name : ''].filter(Boolean).join(' · ')],
    ['가입유형', sel.join === 'change' ? '기기변경' : '번호이동'],
    ['요금제', (avail[sel.plan] || {}).name || ''],
    ['할인방식', sel.discount === 'contract' ? '선택약정할인' : '지원금할인'],
    ['할부개월', sel.months ? sel.months + '개월' : '일시불']
  ].filter(r => r[1]);

  return { text: parts.join(' · '), monthly: s ? s.monthlyTotal : 0, rows: rows };
}

function submitBook() {
  const nameEl = document.getElementById('bookName');
  const phoneEl = document.getElementById('bookPhone');
  const errEl = document.getElementById('bookErr');
  const name = nameEl.value.trim();
  const phone = phoneEl.value.trim();

  if (document.getElementById('bookTrap').value) return;   // 스팸 봇 차단

  if (!name) { errEl.textContent = '이름을 입력해주세요'; nameEl.classList.add('err'); nameEl.focus(); return; }
  if (!/^01[016789]-?\d{3,4}-?\d{4}$/.test(phone.replace(/\s/g, ''))) {
    errEl.textContent = '연락처를 정확히 입력해주세요'; phoneEl.classList.add('err'); phoneEl.focus(); return;
  }
  if (!document.getElementById('bookAgree').checked) {
    errEl.textContent = '개인정보 수집·이용에 동의해주세요'; return;
  }

  const b = bookSummary();
  const btn = document.getElementById('bookSubmit');
  btn.disabled = true; btn.textContent = '전송 중…';

  fetch(GAS_WEB_APP_URL, {
    method: 'post', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      kind: 'consult',                 // 사전예약과 구분. 고객 알림톡은 보내지 않는다.
      name: name,
      phone: phone,
      product: '[상담예약] ' + b.text + (b.monthly ? ' · 월 ' + fmt(b.monthly) : ''),
      source: (typeof visitSource === 'function') ? visitSource() : '',
      page: location.href,
      time: new Date().toString(),
      consent: true,
      consentTime: new Date().toString()
    })
  }).then(bookDone).catch(bookDone);
}

/* 이름 가운데를 가린다. 홍길동 → 홍O동, 김철 → 김O */
function maskName(n) {
  var s = String(n || '').trim();
  if (!s) return '';
  if (s.length === 1) return s + '님';
  if (s.length === 2) return s[0] + 'O님';
  return s[0] + 'O'.repeat(s.length - 2) + s[s.length - 1] + '님';
}

/* 영수증의 카톡 버튼이 보이면 하단 고정바를 숨긴다 (중복 제거)
   var 로 선언해야 한다 — 페이지 로드 코드가 이 줄보다 먼저 실행되므로
   let 이면 초기화 전 접근이 되어 렌더링이 통째로 실패한다.
   화면이 다시 그려질 때마다 감시자를 새로 만들지 않고, 한 번만 연결한 뒤 갱신만 한다. */
var _barUpd;   /* = null 을 붙이면 안 된다 — 로드 중 이미 연결된 값을 되돌려 리스너가 중복된다 */
function watchMainBtn(){
  if (!_barUpd) {
    _barUpd = function(){
      /* 영수증 안의 주 버튼이 화면에 들어오면 고정바는 물러난다.
         주 버튼이 예약(btn-book-main)이 되었으므로 둘 다 찾는다. */
      const t = document.querySelector('.btn-book-main, .btn-book, .btn-kakao-main');
      const bar = document.querySelector('.mbar');
      if (!t || !bar) return;
      const r = t.getBoundingClientRect();
      const visible = r.top < (window.innerHeight - 60) && r.bottom > 0;
      bar.classList.toggle('hide', visible);
    };
    window.addEventListener('scroll', _barUpd, { passive: true });
    window.addEventListener('resize', _barUpd);
  }
  _barUpd();
}

/* 클립보드 복사 (구형 브라우저·비보안 환경 대비 폴백 포함) */
function copyText(t){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).catch(function(){ legacyCopy(t); });
      return true;
    }
  } catch(e){}
  return legacyCopy(t);
}
function legacyCopy(t){
  try {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch(e){ return false; }
}

/* ───── 조건 이미지 저장 / 공유 ─────
   화면 캡처가 아니라 캔버스에 직접 그린다.
   기기 폭·스크롤 위치와 무관하게 항상 동일한 결과가 나온다. */

/* 아이폰은 사진 앱에 저장하려면 공유 시트를 거쳐야 한다.
   안드로이드·PC 는 바로 내려받는 편이 빠르고 예측 가능하다. */
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function canShareFiles(){
  try {
    return !!(navigator.canShare && navigator.share &&
              navigator.canShare({ files: [new File([new Blob([''])], 'a.png', { type:'image/png' })] }));
  } catch(e){ return false; }
}

function toast(msg){
  const el = document.getElementById('toast');
  if (!el) return;
  el.innerHTML = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 3600);
}

function loadImg(src){
  return new Promise(res => {
    if (!src) return res(null);
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = src;
  });
}

/* 캔버스 헬퍼 */
function _rr(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}
function _t(c, s, x, y, size, weight, color, align){
  c.font = weight + ' ' + size + "px 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif";
  c.fillStyle = color;
  c.textAlign = align || 'left';
  c.textBaseline = 'alphabetic';
  c.fillText(s, x, y);
}
/* 주어진 폭에 맞을 때까지 글자 크기를 줄인다 (최소 크기까지 줄여도 넘치면 말줄임) */
function _fit(c, s, x, y, maxW, size, weight, color, align, min){
  let sz = size;
  const set = v => c.font = weight + ' ' + v + "px 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif";
  set(sz);
  while (c.measureText(s).width > maxW && sz > (min || 20)) { sz -= 1; set(sz); }
  let out = s;
  if (c.measureText(out).width > maxW) {
    while (out.length > 1 && c.measureText(out + '…').width > maxW) out = out.slice(0, -1);
    out += '…';
  }
  _t(c, out, x, y, sz, weight, color, align);
  return sz;
}
function _dash(c, x1, x2, y, color){
  c.save(); c.strokeStyle = color; c.lineWidth = 1.5; c.setLineDash([6, 5]);
  c.beginPath(); c.moveTo(x1, y); c.lineTo(x2, y); c.stroke(); c.restore();
}

async function buildEstimateCanvas(){
  const s = compute();
  const W = 860, P = 44;
  const PINK = '#E6007E', INK = '#111111', SUB = '#5c5c66', MUT = '#8a8a95';

  const phone = await loadImg(colorImage(sel.color, sel.storage));
  const logoEl = document.getElementById('siteLogo');
  const logo = (logoEl && logoEl.getAttribute('src')) ? await loadImg(logoEl.getAttribute('src')) : null;

  /* 높이 계산 */
  const rows = [];
  rows.push(['가입유형', sel.join === 'move'
      ? '번호이동 (' + (sel.carrier === 'MVNO' ? '알뜰폰' : sel.carrier) + ')' : '기기변경']);
  rows.push(['요금제', s.plan.name]);
  rows.push(['할인방식', s.kind === 'support' ? '지원금할인' : '선택약정할인']);
  rows.push(['구매방법', s.months ? s.months + '개월 할부' : '일시불']);

  /* 넉넉한 캔버스에 그린 뒤, 마지막에 실제 높이로 잘라낸다.
     항목 수가 달라져도 아래 여백이 남지 않는다. */
  const HEAD = 230, FOOT = 128, HMAX = 2000;

  const cv = document.createElement('canvas');
  cv.width = W * 2; cv.height = HMAX * 2;
  const c = cv.getContext('2d');
  c.scale(2, 2);
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, HMAX);

  /* ── 헤더 ── */
  c.fillStyle = tint(curColor().hex);
  c.fillRect(0, 0, W, HEAD);

  c.fillStyle = '#ffffff';
  _rr(c, P, 36, 158, 158, 20); c.fill();
  if (phone) {
    const box = 130, ox = P + 14, oy = 50;
    const r = Math.min(box / phone.width, box / phone.height);
    const w = phone.width * r, h = phone.height * r;
    c.drawImage(phone, ox + (box - w) / 2, oy + (box - h) / 2, w, h);
  } else {
    _t(c, '이미지 준비중', P + 79, 122, 14, '600', '#c4c4cc', 'center');
  }

  const tx = P + 158 + 28;
  const availW = W - P - tx;
  _fit(c, card.name || '상품', tx, 96, availW, 38, '800', INK, 'left', 22);
  _fit(c, [curColor().name, curStorage().label].filter(Boolean).join('  ·  '),
       tx, 130, availW, 19, '700', 'rgba(0,0,0,.62)', 'left', 13);
  _t(c, '월 예상 금액', tx, 168, 15, '800', 'rgba(0,0,0,.6)');
  _fit(c, fmt(s.monthlyTotal), W - P, 174, availW - 110, 40, '800', INK, 'right', 24);

  /* ── 선택 조건 ── */
  let y = HEAD + 44;
  _t(c, '선택 조건', P, y, 14, '800', MUT);
  y += 20;
  rows.forEach(r => {
    _t(c, r[0], P, y + 22, 17, '600', SUB);
    _fit(c, r[1], W - P, y + 22, W - P * 2 - 160, 17, '800', INK, 'right', 12);
    c.fillStyle = '#f1f1f4'; c.fillRect(P, y + 36, W - P * 2, 1);
    y += 46;
  });

  /* ── A. 월 할부금 ── */
  y += 26;
  c.fillStyle = PINK; _rr(c, P, y - 17, 24, 24, 7); c.fill();
  _t(c, 'A', P + 12, y, 14, '800', '#ffffff', 'center');
  _t(c, s.months ? '월 할부금 (' + s.months + '개월)' : '단말 결제금액 (일시불)', P + 36, y, 20, '800', INK);
  _t(c, fmt(s.months ? s.monthlyInst : s.principal), W - P, y + 2, 24, '800', INK, 'right');
  y += 34;

  const IND = P + 36;
  const line = (k, v, col) => {
    _fit(c, k, IND, y, W - P - IND - 190, 16, '600', col || SUB, 'left', 12);
    _t(c, v, W - P, y, 16, '800', col || INK, 'right');
    y += 40;
  };
  line('출고가', fmt(s.price));
  if (s.kind === 'support') line('이통사 지원금', '-' + fmt(s.subsidy), PINK);
  else                      line('이통사 지원금', '미적용', '#a5a5af');
  line('U+ pick 할인', '-' + fmt(s.upick), PINK);
  c.fillStyle = '#eeeef2'; c.fillRect(IND, y - 26, W - P - IND, 1);
  line('할부원금', fmt(s.principal));
  _t(c, s.months ? '연 5.9% 할부이자 ' + fmt(s.interest) + ' 포함' : '할부이자 없음', IND, y - 14, 14, '600', MUT);

  /* ── B. 월 통신요금 ── */
  y += 34;
  c.fillStyle = '#ececf0'; c.fillRect(P, y - 26, W - P * 2, 1);
  c.fillStyle = PINK; _rr(c, P, y - 17, 24, 24, 7); c.fill();
  _t(c, 'B', P + 12, y, 14, '800', '#ffffff', 'center');
  _t(c, '월 통신요금', P + 36, y, 20, '800', INK);
  _t(c, fmt(s.fee), W - P, y + 2, 24, '800', INK, 'right');
  y += 34;
  line(s.plan.name, fmt(s.plan.monthly));
  if (s.kind === 'contract') line('선택약정 25% 할인', '-' + fmt(s.contractMonthly), PINK);
  _t(c, '부가세(VAT) 포함 금액', IND, y - 14, 14, '600', MUT);

  /* ── 합계 ── */
  y += 30;
  _dash(c, P, W - P, y, '#d8d8e0');
  y += 46;
  _t(c, '월 예상 금액', P, y, 21, '800', INK);
  _t(c, 'A+B', P + 128, y - 2, 13, '800', PINK);
  _t(c, fmt(s.monthlyTotal), W - P, y + 4, 36, '800', PINK, 'right');

  /* ── 푸터 ── */
  y += 40;
  c.fillStyle = '#fafafb'; c.fillRect(0, y, W, FOOT);
  c.fillStyle = '#ececf0'; c.fillRect(0, y, W, 1);
  const fy = y + 52;
  if (logo) {
    const lh = 34, lw = logo.width * (lh / logo.height);
    c.drawImage(logo, P, fy - 24, lw, lh);
    _t(c, '상담문의 ' + TEL, P + lw + 20, fy, 17, '800', INK);
  } else {
    _t(c, 'U+ Pick  ·  상담문의 ' + TEL, P, fy, 17, '800', INK);
  }
  _t(c, '※ 결합 · 복지 · 제휴카드 할인은 미반영 금액입니다. 실제 조건은 상담 시 안내해 드립니다.',
     P, fy + 32, 13.5, '600', MUT);
  const d = new Date();
  const pad = n => (n < 10 ? '0' : '') + n;
  _t(c, d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' 기준',
     W - P, fy + 32, 13.5, '600', MUT, 'right');

  /* 실제 높이로 잘라내기 */
  const finalH = Math.min(HMAX, Math.round(y + FOOT));
  const out = document.createElement('canvas');
  out.width = W * 2; out.height = finalH * 2;
  out.getContext('2d').drawImage(cv, 0, 0, W * 2, finalH * 2, 0, 0, W * 2, finalH * 2);
  return out;
}

function isMobile(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
         (navigator.maxTouchPoints > 1 && window.innerWidth < 1024);
}

function saveEstimate(btn){
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '만드는 중…'; }
  const restore = () => { if (btn) { btn.disabled = false; btn.textContent = label; } };

  buildEstimateCanvas().then(cv => {
    const name = ((card.name || '견적') + '_' + (curStorage().label || '') + '_UPick')
                 .replace(/[^0-9A-Za-z가-힣_]/g, '') + '.png';

    /* 모바일은 인앱 브라우저(네이버·카톡 등)에서 blob 다운로드가 조용히 실패한다.
       이미지를 화면에 띄우고 길게 눌러 저장하게 하면 어디서든 확실히 저장된다. */
    if (isMobile()) {
      openImageSheet(cv.toDataURL('image/png'), name);
      restore();
      return;
    }

    cv.toBlob(blob => {
      if (!blob) { restore(); toast('이미지를 만들지 못했습니다.'); return; }
      downloadBlob(blob, name);
      restore();
      toast('이미지가 <b>다운로드 폴더</b>에 저장되었습니다.');
    }, 'image/png');
  }).catch(() => { restore(); toast('이미지를 만들지 못했습니다.'); });
}

/* 이미지 저장 시트 */
function openImageSheet(dataUrl, name){
  let el = document.getElementById('imgSheet');
  if (!el) {
    el = document.createElement('div');
    el.id = 'imgSheet';
    el.className = 'imgsheet';
    document.body.appendChild(el);
  }
  const ios = isIOS();
  el.innerHTML =
    '<div class="is-guide">이미지를 <b>길게 눌러</b> ' +
      (ios ? '<b>“사진에 추가”</b>' : '<b>“이미지 저장”</b>') + ' 하세요' +
      '<small>저장 후 카카오톡 채팅창의 + → 앨범에서 첨부하시면 됩니다</small>' +
    '</div>' +
    '<img src="' + dataUrl + '" alt="' + esc(name) + '">' +
    '<div class="is-bar">' +
      '<button class="is-close" onclick="closeImageSheet()">닫기</button>' +
      (canShareFiles()
        ? '<button class="is-dl" onclick="shareImageSheet()">다른 앱으로 보내기</button>'
        : '') +
    '</div>';
  el._data = dataUrl; el._name = name;
  el.classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeImageSheet(){
  const el = document.getElementById('imgSheet');
  if (el) el.classList.remove('on');
  document.body.style.overflow = '';
}
function shareImageSheet(){
  const el = document.getElementById('imgSheet');
  if (!el || !el._data) return;
  fetch(el._data).then(r => r.blob()).then(blob => {
    const file = new File([blob], el._name, { type: 'image/png' });
    if (canShareFiles()) navigator.share({ files: [file] }).catch(function(){});
  }).catch(function(){ toast('이미지를 길게 눌러 저장해 주세요.'); });
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ───── 관리자 ─────
   PC : 키보드로 adminjc 입력
   모바일 : 로고 5번 연속 탭
   (index.html 과 동일한 방식) */
const SECRET_KEY = 'adminjc';
let keyBuffer = '';

document.addEventListener('keydown', function(e){
  if (!e.key || e.key.length !== 1) return;
  // 입력창·편집중인 요소에 타이핑할 때는 무시
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  keyBuffer += e.key.toLowerCase();
  if (keyBuffer.length > SECRET_KEY.length) keyBuffer = keyBuffer.slice(-SECRET_KEY.length);
  if (keyBuffer === SECRET_KEY) { keyBuffer = ''; openPwModal(); }
});

/* 로고: 한 번 누르면 첫 화면(index)으로, 빠르게 5번 누르면 관리자 진입.
   두 기능이 같은 자리에 있어서, 이동을 아주 잠깐 미뤄두고
   그 사이에 다음 탭이 들어오면 이동을 취소하는 방식으로 구분한다. */
var _logoNavTimer = null;
function logoTap(){
  tapCount++; clearTimeout(tapTimer);

  clearTimeout(_logoNavTimer);
  if (tapCount >= 5) { tapCount = 0; openPwModal(); return; }

}
function openPwModal(){

function checkPassword(){

  } else {

}
function onEditBtnClick(){ toggleEdit(!editMode); }
function toggleEdit(on){
  editMode = on;
  document.body.classList.toggle('edit-mode', on);
  applyEditable(on);
  const b = document.getElementById('editBtn');
  b.textContent = on ? '✅ 편집 완료' : '편집 시작';

}
function applyEditable(on){
  document.querySelectorAll('.editable').forEach(el => el.contentEditable = on ? 'true' : 'false');
}
function saveAmt(field, val){
  /* 지원금은 요금제별로 따로 가질 수 있으므로 지금 고른 요금제 칸에 기록한다 */
  if (field === 'subsidy') {

  } else {
    curStorage()[field] = fmt(parseAmt(val));
  }
  paintOptions(); paintReceipt();
}
function saveUpick(val){

function savePlanMonthly(val){

  p.monthly = parseAmt(val);
  paintOptions(); paintReceipt();
}

function saveSourceHTML(){
  const btn = document.getElementById('saveBtn');
  const file = srcKey + '.html';
  const restore = () => { btn.textContent = '💾 상품정보 저장'; btn.disabled = false; };

  const patch = (html) => {
    try {
      const s = html.indexOf('<script data-cards="1">');
      if (s === -1) throw new Error('선택한 파일에 상품 데이터가 없습니다. ' + file + ' 이 맞는지 확인해 주세요.');
      const open = html.indexOf('>', s) + 1;
      const close = html.indexOf('<' + '/script>', open);
      const merged = extractCards(html) || [];
      const i = merged.findIndex(c => c.id === card.id);
      if (i >= 0) merged[i] = card; else merged.push(card);
      download(html.slice(0, open) + 'window.__savedCards = ' + JSON.stringify(merged) + ';' + html.slice(close), file);
      alert('저장되었습니다.\n다운로드된 ' + file + ' 을 기존 파일과 교체해 주세요.');
    } catch (e) { alert('저장 실패: ' + e.message); }
    restore();
  };

  // 파일을 직접 열어본 경우(file://)는 브라우저가 다른 파일을 읽지 못한다.
  // 이때는 사용자가 원본 파일을 직접 고르게 한다.
  if (location.protocol === 'file:') {
    toast(file + ' 파일을 선택해 주세요.<br>선택한 파일에 수정 내용을 반영해 내려받습니다.');
    pickFile(patch, restore);
    return;
  }

  btn.textContent = '불러오는 중…'; btn.disabled = true;
  fetch(file)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(patch)
    .catch(() => {
      restore();
      alert('원본 파일을 자동으로 읽지 못했습니다.\n\n' +
            '저장 버튼을 다시 누른 뒤 ' + file + ' 파일을 직접 선택해 주세요.');
      pickFile(patch, restore);
    });
}

/* 원본 HTML 파일 직접 선택 (file:// 환경 대응) */
function pickFile(onLoad, onCancel){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.html,.htm,text/html';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = function(){
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) { if (onCancel) onCancel(); return; }
    const fr = new FileReader();
    fr.onload = () => onLoad(String(fr.result));
    fr.onerror = () => { alert('파일을 읽지 못했습니다.'); if (onCancel) onCancel(); };
    fr.readAsText(f, 'utf-8');
  };
  inp.click();
}
/* 요금제·배너 저장 — 현재 문서를 그대로 복제해 쓴다.
   파일을 직접 열어도(file://) 동작한다. */
function savePlansHTML(){
  try {
    const clone = document.documentElement.cloneNode(true);

    // 화면에 그려진 내용은 되돌린다 (단말 사진이 파일에 박히는 것을 막는다)
    const app = clone.querySelector('#app');
    if (app) app.innerHTML = '<div class="state-msg">상품 정보를 불러오는 중입니다…</div>';

    // 제목도 되돌린다. 안 그러면 마지막에 보던 상품명이 파일에 박혀서
    // 검색 결과와 카톡 공유 미리보기에 그 이름이 그대로 나간다.
    const ti = clone.querySelector('title');
    if (ti) ti.textContent = BASE_TITLE;
    const ogt = clone.querySelector('meta[property="og:title"]');
    if (ogt) ogt.setAttribute('content', BASE_TITLE);

    // 편집 상태 초기화
    const body = clone.querySelector('body');
    if (body) body.classList.remove('edit-mode');
    clone.querySelectorAll('[contenteditable]').forEach(el => el.setAttribute('contenteditable', 'false'));
    const tb = clone.querySelector('#editToolbar'); if (tb) tb.className = 'edit-toolbar';
    const eb = clone.querySelector('#editBtn'); if (eb) { eb.textContent = '편집 시작'; eb.style.background = ''; }
    const sb = clone.querySelector('#saveBtn'); if (sb) sb.style.display = 'none';
    const pb = clone.querySelector('#savePlanBtn'); if (pb) pb.style.display = 'none';
    const lb = clone.querySelector('#toolbarLabel'); if (lb) lb.textContent = '✏️ 관리자 편집 모드';
    const pw = clone.querySelector('#pwOverlay'); if (pw) pw.className = 'pw-overlay';
    /* 상담 예약창이 열린 상태로 굳지 않게 되돌린다 */
    const bk = clone.querySelector('#bookOverlay'); if (bk) bk.className = 'pw-overlay bk-overlay';
    const bd = clone.querySelector('body'); if (bd) bd.classList.remove('modal-open');

    // 요금제·배너 데이터 갱신
    const ds = clone.querySelector('script[data-plans="1"]');
    if (!ds) throw new Error('요금제 블록을 찾지 못했습니다');
    /* 후기도 이 블록에 들어 있으므로 반드시 함께 다시 써야 한다.
       빠뜨리면 요금제를 저장할 때마다 후기가 통째로 사라진다. */
    ds.textContent = '\nwindow.__plans = ' + JSON.stringify(plans, null, 2) + ';\n' +
                     (combo ? 'window.__combo = ' + JSON.stringify(combo, null, 2) + ';\n' : '') +
                     (window.__reviews ? 'window.__reviews = ' + JSON.stringify(window.__reviews, null, 2) + ';\n' : '');

    download('<!DOCTYPE html>\n' + clone.outerHTML, 'detail.html');
    alert('요금제·결합배너·후기가 저장되었습니다.\n다운로드된 detail.html 을 교체해 주세요.');
  } catch (e) {
    alert('저장 실패: ' + e.message);
  }
}
function download(text, filename){
  const blob = new Blob([text], { type:'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename; a.click();
  URL.revokeObjectURL(a.href);
}
