<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사전예약 - U+ Pick</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:#f7f8fa; color:#222; max-width:1200px; margin:0 auto; min-height:100vh;
  }
  a { color:inherit; text-decoration:none; }

  /* ── 상단 고정 영역 (툴바 + 헤더) ── */
  .sticky-head { position:sticky; top:0; z-index:200; }
  .edit-toolbar {
    background:#222; color:#fff; padding:10px 16px;
    display:none; align-items:center; justify-content:space-between; font-size:12px;
  }
  .edit-toolbar.visible { display:flex; }
  .edit-toolbar span { opacity:.8; }
  .edit-toggle {
    background:#555; color:#fff; border:none; border-radius:6px;
    padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .top-header {
    background:#fff; padding:16px 24px; display:flex; align-items:center; gap:12px;
    border-bottom:1px solid #eee;
  }
  .back-btn { background:none; border:none; cursor:pointer; font-size:22px; color:#111; padding:0; line-height:1; }
  .top-header-title { font-size:17px; font-weight:800; color:#111; }

  /* ── 비밀번호 모달 ── */
  .pw-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.6);
    z-index:999; align-items:center; justify-content:center;
  }
  .pw-overlay.show { display:flex; }
  .pw-modal {
    background:#fff; border-radius:16px; padding:32px 28px; width:300px;
    text-align:center; box-shadow:0 8px 40px rgba(0,0,0,.25);
  }
  .pw-modal h3 { font-size:17px; font-weight:800; color:#111; margin-bottom:6px; }
  .pw-modal p { font-size:12px; color:#888; margin-bottom:20px; }
  .pw-input {
    width:100%; border:2px solid #ddd; border-radius:10px; padding:12px 14px;
    font-size:16px; text-align:center; letter-spacing:4px; outline:none;
    margin-bottom:8px; transition:border .2s;
  }
  .pw-input:focus { border-color:#E6007E; }
  .pw-input.error { border-color:#ff3b3b; animation:shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .pw-error { font-size:12px; color:#ff3b3b; margin-bottom:14px; min-height:16px; }
  .pw-btn-row { display:flex; gap:8px; }
  .pw-confirm, .pw-cancel {
    flex:1; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:700; cursor:pointer;
  }
  .pw-confirm { background:#E6007E; color:#fff; }
  .pw-cancel { background:#eee; color:#555; }

  /* ── 페이지 타이틀 ── */
  .page-title-wrap { padding:24px 20px 4px; }
  .page-title-row { display:flex; align-items:baseline; gap:10px; }
  .page-title { font-size:26px; font-weight:900; color:#111; }
  .page-title-badge { font-size:13px; font-weight:700; color:#aaa; letter-spacing:.5px; }

  /* ── 카드 그리드 (홈캠 페이지와 동일한 반응형 그리드: 모바일 1열 / PC 3열) ── */
  .preorder-list {
    padding:20px 16px 60px; display:grid; grid-template-columns:1fr; gap:16px;
  }
  @media (min-width:768px) {
    .preorder-list { grid-template-columns:repeat(3,1fr); padding:24px 32px 60px; gap:24px; }
  }

  .preorder-card {
    background:#fff; border-radius:16px; overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,0.07); position:relative;
  }
  .card-delete-btn {
    display:none; position:absolute; top:10px; right:10px; background:#ff3b3b; color:#fff;
    border:none; border-radius:50%; width:26px; height:26px; font-size:14px; cursor:pointer;
    z-index:10; align-items:center; justify-content:center;
  }
  body.edit-mode .card-delete-btn { display:flex; }

  .preorder-img-wrap {
    width:100%; aspect-ratio:1/1; position:relative; background:#111;
    display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:default;
  }
  body.edit-mode .preorder-img-wrap { cursor:pointer; }
  .preorder-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  .preorder-img-placeholder { font-size:38px; color:#666; }
  body.edit-mode .preorder-img-wrap::after {
    content:'📷 클릭하여 이미지 교체'; position:absolute; inset:0; background:rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700;
    opacity:0; transition:opacity .15s;
  }
  body.edit-mode .preorder-img-wrap:hover::after { opacity:1; }
  .preorder-img-wrap input[type=file] { display:none; }

  .preorder-info { padding:16px 18px 20px; }
  .preorder-title {
    font-size:15.5px; font-weight:800; color:#111; line-height:1.4; margin-bottom:8px;
  }
  .preorder-date { font-size:13px; color:#888; font-weight:500; }

  .detail-edit-link { display:none; }
  body.edit-mode .detail-edit-link {
    display:inline-block; margin-top:10px; background:none; border:none; padding:0;
    font-size:12.5px; font-weight:700; color:#E6007E; cursor:pointer;
  }
  body.edit-mode .detail-edit-link:hover { text-decoration:underline; }

  .editable { outline:none; }
  body.edit-mode .editable {
    cursor:text; border-bottom:1.5px dashed #E6007E; border-radius:2px;
  }
  body.edit-mode .editable:focus { background:#fff5fa; }

  .add-card-btn {
    display:none; background:#fff; border:2px dashed #ddd; border-radius:16px;
    padding:28px; text-align:center; color:#bbb; font-size:14px; font-weight:700; cursor:pointer;
    align-items:center; justify-content:center; min-height:200px;
  }
  body.edit-mode .add-card-btn { display:flex; }
  .add-card-btn:hover { border-color:#E6007E; color:#E6007E; background:#fff5fa; }

  /* ── 하단 고정 CTA ── */
  .bottom-cta {
    position:sticky; bottom:20px; display:flex; justify-content:center; gap:12px;
    z-index:100; pointer-events:none; padding:0 20px;
  }
  .cta-kakao, .cta-call {
    pointer-events:all; height:52px; padding:0 22px; border-radius:26px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    border:none; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,0.22);
    transition:transform .15s, box-shadow .15s; font-size:14px; font-weight:800;
  }
  .cta-kakao { background:#FEE500; color:#3A1D1D; }
  .cta-kakao:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,0.28); }
  .cta-kakao .talk-bubble { font-size:18px; line-height:1; }
  .cta-call { background:#E6007E; color:#fff; }
  .cta-call:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(230,0,126,0.45); }
  .cta-call .uplus-badge { font-size:13px; font-weight:900; color:#fff; background:rgba(255,255,255,0.25); padding:2px 6px; border-radius:4px; }

  /* 상세 페이지용 CTA: 짧은 콘텐츠 위에 떠서 겹치지 않도록 sticky 대신 본문 흐름에 고정 배치 */
  .detail-cta { display:flex; justify-content:center; gap:12px; margin-top:28px; }

  /* ── 상세 페이지 ── */
  .detail-wrap { padding:20px 20px 50px; max-width:720px; margin:0 auto; }
  .detail-back {
    background:none; border:none; cursor:pointer; font-size:13px; font-weight:700; color:#666;
    display:flex; align-items:center; gap:4px; margin-bottom:16px; padding:4px 0;
  }
  .detail-back:hover { color:#E6007E; }
  .detail-hero {
    width:100%; aspect-ratio:1/1; position:relative; background:#111; border-radius:16px;
    overflow:hidden; display:flex; align-items:center; justify-content:center; cursor:default;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
  }
  body.edit-mode .detail-hero { cursor:pointer; }
  .detail-hero img { width:100%; height:100%; object-fit:cover; display:block; }
  .detail-hero-placeholder { font-size:44px; color:#666; }
  body.edit-mode .detail-hero::after {
    content:'📷 클릭하여 이미지 교체'; position:absolute; inset:0; background:rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:700;
    opacity:0; transition:opacity .15s;
  }
  body.edit-mode .detail-hero:hover::after { opacity:1; }
  .detail-hero input[type=file] { display:none; }

  .detail-info { padding:20px 4px 8px; }
  .detail-title { font-size:20px; font-weight:900; color:#111; line-height:1.4; margin-bottom:8px; }
  .detail-date { font-size:13.5px; color:#888; font-weight:500; margin-bottom:4px; }

  .detail-blocks { padding:12px 4px 4px; }
  .detail-block { position:relative; margin-bottom:16px; }
  .detail-block:last-child { margin-bottom:6px; }
  .detail-block-text { font-size:14.5px; line-height:1.7; color:#444; white-space:pre-wrap; }
  .detail-block-img { display:block; width:100%; border-radius:12px; }
  .detail-block-del { display:none; }
  body.edit-mode .detail-block-del {
    display:flex; align-items:center; justify-content:center;
    position:absolute; top:-6px; right:-6px; width:24px; height:24px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; border:none; font-size:12px; font-weight:900; cursor:pointer;
  }
  body.edit-mode .detail-block-del:hover { background:#E6007E; }

  .detail-block-toolbar { display:none; padding:8px 4px 20px; gap:8px; }
  body.edit-mode .detail-block-toolbar { display:flex; }
  .detail-block-toolbar button {
    background:#fff; border:1px solid #ddd; border-radius:20px; padding:7px 16px;
    font-size:12.5px; font-weight:700; color:#555; cursor:pointer;
  }
  .detail-block-toolbar button:hover { border-color:#E6007E; color:#E6007E; background:#fff5fa; }

  @media (max-width:600px) {
    .page-title { font-size:22px; }
    .detail-title { font-size:18px; }
  }
</style>
</head>
<body>

<!-- 비밀번호 모달 -->
<div class="pw-overlay" id="pwOverlay">
  <div class="pw-modal">
    <h3>🔐 관리자 인증</h3>
    <p>편집 모드 진입을 위해<br>관리자 비밀번호를 입력하세요</p>
    <input class="pw-input" id="pwInput" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter') checkPassword()" oninput="document.getElementById('pwInput').classList.remove('error'); document.getElementById('pwError').textContent=''">
    <div class="pw-error" id="pwError"></div>
    <div class="pw-btn-row">
      <button class="pw-cancel" onclick="closePwModal()">취소</button>
      <button class="pw-confirm" onclick="checkPassword()">확인</button>
    </div>
  </div>
</div>

<div class="sticky-head">
  <div class="edit-toolbar" id="editToolbar">
    <span id="toolbarLabel">✏️ 관리자 편집 모드</span>
    <button class="edit-toggle" id="editBtn" onclick="onEditBtnClick()" style="background: rgb(85, 85, 85);">편집 시작</button>
    <button class="edit-toggle" id="saveBtn" onclick="saveHTML()" style="background: rgb(26, 115, 232); display: none;">💾 파일 저장</button>
  </div>

  <div class="top-header">
    <button class="back-btn" onclick="history.back()">←</button>
    <div class="top-header-title" onclick="logoTap()" style="cursor:default;">사전예약</div>
  </div>
</div>

<div id="listView">
  <div class="page-title-wrap">
    <div class="page-title-row">
      <div class="page-title">사전예약</div>
      <div class="page-title-badge">PRE-ORDER</div>
    </div>
  </div>

  <div class="preorder-list" id="preorderList"></div>
</div>

<div id="detailView" style="display:none"></div>

<div class="bottom-cta" id="listBottomCta">
  <a class="cta-kakao" href="http://pf.kakao.com/_xdxaxlxfX/chat" target="_blank">
    <div class="talk-bubble">💬</div>
    카톡 문의하기
  </a>
  <a class="cta-call" href="tel:010-8000-5748">
    <span class="uplus-badge">U+</span>
    전화 문의하기
  </a>
</div>

  let editMode = false;

  function renderList() {
    const listEl = document.getElementById('preorderList');
    listEl.innerHTML = '';

    preorderData.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'preorder-card';
      card.dataset.idx = idx;
      card.innerHTML = `
        <button type="button" class="card-delete-btn" onclick="deleteCard(${idx})">✕</button>
        <div class="preorder-img-wrap" onclick="handleCardImgClick(${idx})">
          ${item.img
            ? `<img src="${item.img}">`
            : `<div class="preorder-img-placeholder">🖼️</div>`}
          <input type="file" accept="image/*" onchange="replaceImg(${idx}, this)">
        </div>
        <div class="preorder-info">
          <div class="preorder-title editable" contenteditable="false" oninput="preorderData[${idx}].title = this.textContent">${escapeHtml(item.title)}</div>
          <div class="preorder-date editable" contenteditable="false" oninput="preorderData[${idx}].date = this.textContent">${escapeHtml(item.date)}</div>
          <button type="button" class="detail-edit-link" onclick="location.href='preorder.html?id=${idx}'">상세페이지 편집 →</button>
        </div>
      `;
      listEl.appendChild(card);
    });

    const addTile = document.createElement('div');
    addTile.className = 'add-card-btn';
    addTile.textContent = '+ 카드 추가';
    addTile.onclick = addCard;
    listEl.appendChild(addTile);

    applyEditableState();
  }

  function applyEditableState() {
    document.querySelectorAll('.editable').forEach(el => {
      el.contentEditable = editMode ? 'true' : 'false';
    });
  }

  /* 카드 이미지 클릭: 편집모드면 이미지 교체, 아니면 상세 페이지로 이동 */
  function handleCardImgClick(idx) {
    if (editMode) { triggerImg(idx); return; }
    location.href = 'preorder.html?id=' + idx;
  }

  /* ── 상세 페이지 ── */
  function renderDetail(idx) {
    const item = preorderData[idx];
    const wrap = document.getElementById('detailView');
    if (!item) { wrap.innerHTML = '<div class="detail-wrap"><p>존재하지 않는 상품입니다.</p><button class="detail-back" onclick="location.href=\'preorder.html\'">← 목록으로</button></div>'; return; }
    if (!item.detail) item.detail = [{ type:'text', content:'' }];

    wrap.innerHTML = `
      <div class="detail-wrap">
        <button type="button" class="detail-back" onclick="location.href='preorder.html'">← 목록으로</button>
        <div class="detail-hero" onclick="triggerDetailImg(${idx})">
          ${item.img ? `<img src="${item.img}">` : `<div class="detail-hero-placeholder">🖼️</div>`}
          <input type="file" accept="image/*" id="detailImgInput" onchange="replaceDetailImg(${idx}, this)">
        </div>
        <div class="detail-info">
          <div class="detail-title editable" contenteditable="false" oninput="preorderData[${idx}].title = this.textContent">${escapeHtml(item.title)}</div>
          <div class="detail-date editable" contenteditable="false" oninput="preorderData[${idx}].date = this.textContent">${escapeHtml(item.date)}</div>
        </div>
        <div class="detail-blocks" id="detailBlocks">${renderDetailBlocks(item, idx)}</div>
        <div class="detail-block-toolbar">
          <button type="button" onclick="addDetailTextBlock(${idx})">📝 텍스트 추가</button>
          <button type="button" onclick="triggerAddDetailImage(${idx})">🖼️ 이미지 추가</button>
          <input type="file" id="detailBlockImgInput-${idx}" accept="image/*" style="display:none" onchange="handleAddDetailImage(${idx}, this)">
        </div>
        <div class="detail-cta">
          <a class="cta-kakao" href="http://pf.kakao.com/_xdxaxlxfX/chat" target="_blank">
            <div class="talk-bubble">💬</div>
            카톡 문의하기
          </a>
          <a class="cta-call" href="tel:010-8000-5748">
            <span class="uplus-badge">U+</span>
            전화 문의하기
          </a>
        </div>
      </div>
    `;
    applyEditableState();
  }

  function renderDetailBlocks(item, idx) {
    return (item.detail || []).map((block, bi) => {
      if (block.type === 'image') {
        return `
          <div class="detail-block" data-type="image">
            <img class="detail-block-img" src="${block.src}">
            <button type="button" class="detail-block-del" onclick="deleteDetailBlock(${idx},${bi})">✕</button>
          </div>`;
      }
      return `
        <div class="detail-block" data-type="text">
          <div class="detail-block-text editable" contenteditable="false" oninput="preorderData[${idx}].detail[${bi}].content = this.textContent">${escapeHtml(block.content)}</div>
          <button type="button" class="detail-block-del" onclick="deleteDetailBlock(${idx},${bi})">✕</button>
        </div>`;
    }).join('');
  }

  function addDetailTextBlock(idx) {
    if (!editMode) return;
    preorderData[idx].detail.push({ type:'text', content:'새 내용을 입력하세요' });
    renderDetail(idx);
  }

  function triggerAddDetailImage(idx) {
    if (!editMode) return;
    document.getElementById('detailBlockImgInput-' + idx).click();
  }

  function handleAddDetailImage(idx, input) {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const original = new Image();
      original.onload = () => {
        const MAX = 900;
        let w = original.width, h = original.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(original, 0, 0, w, h);
        preorderData[idx].detail.push({ type:'image', src: canvas.toDataURL('image/jpeg', 0.88) });
        renderDetail(idx);
      };
      original.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function deleteDetailBlock(idx, bi) {
    if (!editMode) return;
    const blocks = preorderData[idx].detail;
    if (blocks.length <= 1) { alert('최소 1개의 내용 블록은 남아있어야 합니다.'); return; }
    if (!confirm('이 블록을 삭제할까요?')) return;
    blocks.splice(bi, 1);
    renderDetail(idx);
  }

  function triggerDetailImg(idx) {
    if (!editMode) return;
    document.getElementById('detailImgInput').click();
  }

  function replaceDetailImg(idx, input) {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const original = new Image();
      original.onload = () => {
        const MAX = 1000;
        let w = original.width, h = original.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(original, 0, 0, w, h);
        preorderData[idx].img = canvas.toDataURL('image/jpeg', 0.88);
        renderDetail(idx);
      };
      original.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  /* URL의 ?id= 값에 따라 목록/상세 뷰를 전환 */
  function route() {
    const params = new URLSearchParams(location.search);
    const idStr = params.get('id');
    const id = idStr !== null ? parseInt(idStr, 10) : NaN;
    if (!isNaN(id) && preorderData[id]) {
      document.getElementById('listView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
      document.getElementById('listBottomCta').style.display = 'none';
      renderDetail(id);
    } else {
      document.getElementById('detailView').style.display = 'none';
      document.getElementById('listView').style.display = 'block';
      document.getElementById('listBottomCta').style.display = 'flex';
      renderList();
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function triggerImg(idx) {
    if (!editMode) return;
    const card = document.querySelector(`.preorder-card[data-idx="${idx}"]`);
    if (card) card.querySelector('input[type=file]').click();
  }

  function replaceImg(idx, input) {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const original = new Image();
      original.onload = () => {
        const MAX = 900;
        let w = original.width, h = original.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(original, 0, 0, w, h);
        preorderData[idx].img = canvas.toDataURL('image/jpeg', 0.88);
        renderList();
      };
      original.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function addCard() {
    if (!editMode) return;
    preorderData.push({ img:'', title:'새 사전예약 상품명', date:'2026.01.01 ~ 2026.01.31', detail:[{type:'text', content:'상세 설명을 입력하세요'}] });
    renderList();
  }

  function deleteCard(idx) {
    if (!editMode) return;
    if (!confirm('이 카드를 삭제할까요?')) return;
    preorderData.splice(idx, 1);
    renderList();
  }

  route();

  /* ── 관리자 편집 모드 (index.html / faq.html과 동일한 방식) ── */
  const ADMIN_PASSWORD = 'jc316719';
  let adminLogged = false;
  let keyBuffer = '';
  const SECRET_KEY = 'adminjc';

  document.addEventListener('keydown', (e) => {
    keyBuffer += e.key.toLowerCase();
    if (keyBuffer.length > SECRET_KEY.length) keyBuffer = keyBuffer.slice(-SECRET_KEY.length);
    if (keyBuffer === SECRET_KEY) { keyBuffer = ''; openPwModal(); }
  });

  let tapCount = 0, tapTimer = null;
  function logoTap() {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
    if (tapCount >= 5) { tapCount = 0; openPwModal(); }
  }

  function openPwModal() {
    document.getElementById('pwInput').value = '';
    document.getElementById('pwError').textContent = '';
    document.getElementById('pwInput').classList.remove('error');
    document.getElementById('pwOverlay').classList.add('show');
    setTimeout(() => document.getElementById('pwInput').focus(), 100);
  }
  function closePwModal() { document.getElementById('pwOverlay').classList.remove('show'); }

  function checkPassword() {
    const val = document.getElementById('pwInput').value;
    if (val === ADMIN_PASSWORD) {
      closePwModal();
      adminLogged = true;
      document.getElementById('editToolbar').classList.add('visible');
      toggleEdit(true);
    } else {
      const input = document.getElementById('pwInput');
      const err = document.getElementById('pwError');
      input.classList.add('error');
      err.textContent = '비밀번호가 틀렸습니다.';
      input.value = '';
      input.focus();
    }
  }

  function onEditBtnClick() { toggleEdit(!editMode); }

  function toggleEdit(on) {
    editMode = on;
    document.body.classList.toggle('edit-mode', editMode);
    document.querySelectorAll('.editable').forEach(el => { el.contentEditable = on ? 'true' : 'false'; });
    const btn = document.getElementById('editBtn');
    const label = document.getElementById('toolbarLabel');
    const saveBtn = document.getElementById('saveBtn');
    if (editMode) {
      btn.textContent = '✅ 편집 완료';
      btn.style.background = '#28a745';
      label.textContent = '✏️ 편집 중 — 이미지를 클릭하여 교체 / 텍스트를 클릭하여 수정';
      if (saveBtn) saveBtn.style.display = 'none';
    } else {
      btn.textContent = '편집 시작';
      btn.style.background = '#555';
      if (saveBtn) saveBtn.style.display = 'inline-block';
      label.textContent = '✏️ 관리자 편집 모드';
    }
  }

  function saveHTML() {
    const clone = document.documentElement.cloneNode(true);
    clone.querySelector('body').classList.remove('edit-mode');
    clone.querySelectorAll('[contenteditable]').forEach(el => el.setAttribute('contenteditable', 'false'));
    const toolbar = clone.querySelector('#editToolbar');
    if (toolbar) toolbar.className = 'edit-toolbar';
    const editBtn = clone.querySelector('#editBtn');
    if (editBtn) { editBtn.textContent = '편집 시작'; editBtn.style.background = 'rgb(85, 85, 85)'; }
    const toolbarLabel = clone.querySelector('#toolbarLabel');
    if (toolbarLabel) toolbarLabel.textContent = '✏️ 관리자 편집 모드';
    const saveBtn = clone.querySelector('#saveBtn');
    if (saveBtn) saveBtn.style.display = 'none';
    try {
      const existingScript = clone.querySelector('script[data-preorder]');
      if (existingScript) existingScript.remove();
      const dataScript = clone.ownerDocument.createElement('script');
      dataScript.setAttribute('data-preorder', '1');
      dataScript.textContent = 'window.__savedPreorderData = ' + JSON.stringify(preorderData) + ';';
      clone.querySelector('head').appendChild(dataScript);
    } catch(e) {}
    const html = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'preorder.html';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  if (window.__savedPreorderData) {
    preorderData = window.__savedPreorderData;
    route();
  }
</script>

</body>
</html>
